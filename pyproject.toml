[tool.poetry]
name = "oai-harvester"
version = "0.1.0"
description = "OAI-PMH Dublin Core harvester"
authors = ["J Evans"]
license = "MIT"
packages = [{ include = "oai_harvester" }]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.31"
openpyxl = "^3.1"
pymarc = "^5.1"
rdflib = "^7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
responses = "^0.25"

[tool.poetry.scripts]
oai-harvest = "oai_harvester.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
